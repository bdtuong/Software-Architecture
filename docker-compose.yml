services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tmc
      POSTGRES_PASSWORD: tmc_local
      POSTGRES_DB: tmc_attendance
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tmc -d tmc_attendance']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
